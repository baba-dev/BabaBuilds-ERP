<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Domestic vs export client logic">
  <defs>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#0f172a}
      .muted{fill:#475569}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .pill{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}
      .good{fill:#ecfdf5;stroke:#a7f3d0;stroke-width:2}
      .warn{fill:#fff7ed;stroke:#fdba74;stroke-width:2}
      .line{stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>

  <text x="60" y="70" font-size="30" font-weight="800">Client classification used on invoices</text>
  <text x="60" y="102" font-size="16" class="muted">How the Export client toggle influences invoice headers and tax handling.</text>

  <rect class="box" x="60" y="150" width="330" height="120" rx="20"/>
  <text x="90" y="190" font-size="18" font-weight="800">Client record</text>
  <rect class="pill" x="90" y="210" width="270" height="40" rx="18"/>
  <text x="110" y="236" font-size="14" font-weight="700">Export client toggle</text>

  <line class="line" x1="390" y1="210" x2="520" y2="210"/>
  <line class="line" x1="390" y1="250" x2="520" y2="250"/>
  <polygon points="520,210 510,204 510,216" fill="#94a3b8"/>
  <polygon points="520,250 510,244 510,256" fill="#94a3b8"/>

  <rect class="good" x="540" y="150" width="600" height="150" rx="22"/>
  <text x="570" y="190" font-size="18" font-weight="900">If Export = ON</text>
  <text x="570" y="220" font-size="15" class="muted">Invoice header:</text>
  <text x="720" y="220" font-size="15" font-weight="800">EXPORT OF SERVICES</text>
  <text x="570" y="246" font-size="15" class="muted">Tax:</text>
  <text x="620" y="246" font-size="15" font-weight="800">Zerorated / IGST 0% (as applicable)</text>
  <text x="570" y="272" font-size="15" class="muted">Footer:</text>
  <text x="650" y="272" font-size="15" font-weight="700">Includes export declaration line</text>

  <rect class="warn" x="540" y="320" width="600" height="150" rx="22"/>
  <text x="570" y="360" font-size="18" font-weight="900">If Export = OFF</text>
  <text x="570" y="390" font-size="15" class="muted">Invoice header:</text>
  <text x="720" y="390" font-size="15" font-weight="800">TAX INVOICE</text>
  <text x="570" y="416" font-size="15" class="muted">Tax:</text>
  <text x="620" y="416" font-size="15" font-weight="800">GST/VAT/Sales tax based on workspace settings</text>
  <text x="570" y="442" font-size="15" class="muted">Footer:</text>
  <text x="650" y="442" font-size="15" font-weight="700">Standard domestic declarations</text>
</svg>
