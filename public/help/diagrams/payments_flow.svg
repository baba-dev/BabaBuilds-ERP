<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#111827; }
      .sub { font: 600 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#6B7280; letter-spacing: .12em; }
      .cardTitle { font: 800 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#111827; }
      .cardText { font: 600 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#4B5563; }
      .pill { font: 800 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#111827; letter-spacing:.08em;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g transform="translate(44 36)">
    <text class="sub" x="0" y="14">HELP CENTER " PAYMENTS</text>
    <text class="title" x="0" y="44">How payment links flow from your ERP to your client</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="44" y="96" width="1112" height="372" rx="24" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- Cards -->
  <g transform="translate(86 140)">
    <!-- 1 -->
    <g>
      <rect x="0" y="0" width="240" height="220" rx="18" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="18" y="18" width="46" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text class="pill" x="30" y="34">STEP 1</text>
      <text class="cardTitle" x="18" y="74">Connect gateway</text>
      <text class="cardText" x="18" y="98">Add Stripe or Razorpay keys</text>
      <text class="cardText" x="18" y="120">in Settings ’ Payments.</text>
      <rect x="18" y="152" width="204" height="46" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text class="cardText" x="32" y="180">Saved & encrypted</text>
    </g>

    <!-- Arrow -->
    <path d="M255 108 C 290 108, 290 108, 324 108" fill="none" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round"/>
    <path d="M324 108 l-14 -10 v20 z" fill="#6366F1"/>

    <!-- 2 -->
    <g transform="translate(350 0)">
      <rect x="0" y="0" width="240" height="220" rx="18" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="18" y="18" width="46" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text class="pill" x="30" y="34">STEP 2</text>
      <text class="cardTitle" x="18" y="74">Generate invoice</text>
      <text class="cardText" x="18" y="98">ERP creates invoice + PDF</text>
      <text class="cardText" x="18" y="120">and requests a payment link.</text>
      <rect x="18" y="152" width="204" height="46" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text class="cardText" x="32" y="180">Link is embedded</text>
    </g>

    <!-- Arrow -->
    <path d="M605 108 C 640 108, 640 108, 674 108" fill="none" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round"/>
    <path d="M674 108 l-14 -10 v20 z" fill="#6366F1"/>

    <!-- 3 -->
    <g transform="translate(700 0)">
      <rect x="0" y="0" width="240" height="220" rx="18" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect x="18" y="18" width="46" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text class="pill" x="30" y="34">STEP 3</text>
      <text class="cardTitle" x="18" y="74">Client pays</text>
      <text class="cardText" x="18" y="98">Client clicks link from</text>
      <text class="cardText" x="18" y="120">PDF or email, pays securely.</text>
      <rect x="18" y="152" width="204" height="46" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text class="cardText" x="32" y="180">Stripe/Razorpay checkout</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(86 408)">
    <rect x="0" y="0" width="1028" height="44" rx="14" fill="#111827" opacity="0.06"/>
    <text class="cardText" x="16" y="28">Tip: If your gateway is not connected, invoices generate normally  they just wont include a payment link.</text>
  </g>
</svg>
