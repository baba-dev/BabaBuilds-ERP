<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">Which payment QR code appears on an invoice</title>
  <desc id="d">If the invoice has a payment link, its QR comes first. Otherwise a UPI QR built from your UPI ID is shown, then up to three QR images you uploaded, such as Paytm or Google Pay.</desc>
  <rect width="960" height="330" rx="20" fill="#fff7ed"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="40" y="52" font-size="22" font-weight="700" fill="#1c1917">Which QR code do your clients scan?</text>
    <text x="40" y="78" font-size="15" fill="#57534e">Pay-Fast and the 80mm receipt pick the best option automatically.</text>
    <g transform="translate(40,110)"><rect width="270" height="170" rx="16" fill="#fff" stroke="#fdba74" stroke-width="2"/><circle cx="34" cy="36" r="15" fill="#c2410c"/><text x="34" y="42" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">1</text><text x="62" y="42" font-size="17" font-weight="700" fill="#1c1917">Payment link QR</text><text x="24" y="82" font-size="14" fill="#57534e">Razorpay or Stripe link on the</text><text x="24" y="102" font-size="14" fill="#57534e">invoice. Pays the net amount</text><text x="24" y="122" font-size="14" fill="#57534e">and updates the invoice.</text></g>
    <g transform="translate(345,110)"><rect width="270" height="170" rx="16" fill="#fff" stroke="#e7e5e4" stroke-width="2"/><circle cx="34" cy="36" r="15" fill="#78716c"/><text x="34" y="42" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">2</text><text x="62" y="42" font-size="17" font-weight="700" fill="#1c1917">UPI QR from your UPI ID</text><text x="24" y="82" font-size="14" fill="#57534e">Built for each invoice with the</text><text x="24" y="102" font-size="14" fill="#57534e">exact amount and invoice number.</text><text x="24" y="122" font-size="14" fill="#57534e">Works in any UPI app.</text></g>
    <g transform="translate(650,110)"><rect width="270" height="170" rx="16" fill="#fff" stroke="#e7e5e4" stroke-width="2"/><circle cx="34" cy="36" r="15" fill="#78716c"/><text x="34" y="42" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">3</text><text x="62" y="42" font-size="17" font-weight="700" fill="#1c1917">Your uploaded QR images</text><text x="24" y="82" font-size="14" fill="#57534e">Up to three static QRs from</text><text x="24" y="102" font-size="14" fill="#57534e">Paytm, Google Pay or your bank.</text><text x="24" y="122" font-size="14" fill="#57534e">Client types the amount.</text></g>
    <g fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"><path d="M316 195h19"/><path d="M621 195h19"/></g><g fill="#c2410c"><path d="M335 189l7 6-7 6z"/><path d="M640 189l7 6-7 6z"/></g>
  </g>
</svg>
