name: ERP PostgreSQL protected backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: read
jobs:
  backup:
    if: vars.ERP_POSTGRES_PRODUCTION_VERIFIED == 'true' && vars.ERP_POSTGRES_CUTOVER_APPROVED == 'true'
    runs-on: [self-hosted, linux, x64, erp-ci]
    timeout-minutes: 25
    steps:
      - name: Execute installed root-reviewed backup helper
        run: sudo -n /usr/local/sbin/bababuilds-erp-backup
