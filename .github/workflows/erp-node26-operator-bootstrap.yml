name: ERP Node26 protected operator bootstrap

# One-time main-only root-owned install of reviewed release helpers/config.
# Does NOT activate ERP, create a staging database, change cron, run backups,
# set deploy variables, or start any systemd timer.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/erp-node26-operator-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-node26-operator-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Install verified ERP-only release tools without activation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Upload reviewed operator sources to temporary area
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "ops/erp-release/promote.py,ops/erp-release/package.py,ops/erp-release/install.sh,ops/erp-release/release-manager.example.json,ops/erp-release/recovery.example.json,ops/systemd/erp-node26-candidate@.service,ops/systemd/erp-release-watchdog.service,ops/systemd/erp-release-watchdog.timer,scripts/backup.sh"
          target: /tmp/erp-node26-operator-${{ github.sha }}

      - name: Verify installed root-owned source SHA and install safely
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            incoming="/tmp/erp-node26-operator-${{ github.sha }}"
            reviewed="/usr/local/share/bababuilds-erp-node26-review"
            test -f "$incoming/ops/erp-release/install.sh"
            test "$(sudo -n /opt/bababuilds-erp/node26/bin/node --version)" = "v26.13.1"
            test -x /opt/bababuilds-erp/node22/bin/node
            sudo -n systemctl is-active --quiet pm2-root
            sudo -n systemctl is-active --quiet postgresql@17-main
            sudo -n systemctl is-active --quiet menuminute-web
            sudo -n systemctl is-active --quiet menuminute-worker
            sudo -n systemctl is-active --quiet clubkeep-web
            sudo -n install -d -o root -g root -m 0755 "$reviewed"
            # Copy as root first, then verify the root-owned bytes. The uploaded
            # temporary source is NEVER executed with elevated privileges.
            while read -r expected relative; do
              src="$incoming/$relative"
              dst="$reviewed/$relative"
              test -f "$src" && test ! -L "$src"
              sudo -n install -d -o root -g root -m 0755 "$(dirname "$dst")"
              sudo -n install -o root -g root -m 0644 "$src" "$dst"
              actual="$(sudo -n git hash-object "$dst")"
              test "$actual" = "$expected" || { echo "Reviewed source verification failed for $relative"; exit 1; }
            done <<'MANIFEST'
            50983a25482a10915b8e47187d1b5a38e04a971f ops/erp-release/promote.py
            17ec4387ddd0608669c86859e53ee9d461d30c63 ops/erp-release/package.py
            c5a594c474ee9f7e1f7f04e205a8ae4d5de7ecb5 ops/erp-release/install.sh
            8e6e2c3ae229788a51f3f49a2faf71ea5024df7e ops/erp-release/release-manager.example.json
            6de1b2f4acbb8d63440151607238ca2c23cc1d4e ops/erp-release/recovery.example.json
            defc8ff99547f520db6d82b48a4d4d2825c4d152 ops/systemd/erp-node26-candidate@.service
            dfd6d566e27ab67e5d57e2704e6a2fe86eb870cb ops/systemd/erp-release-watchdog.service
            d4d3f0e8084273dbe5a43c37f0485307e0194854 ops/systemd/erp-release-watchdog.timer
            2a14c897974fc2a62f01df1521960ab6156d6c4f scripts/backup.sh
            MANIFEST

            sudo -n bash -n "$reviewed/ops/erp-release/install.sh" "$reviewed/scripts/backup.sh"
            # All code executed as root is now in a root-owned verified directory.
            sudo -n bash "$reviewed/ops/erp-release/install.sh"
            sudo -n install -o root -g root -m 0700 "$reviewed/scripts/backup.sh" /usr/local/sbin/bababuilds-erp-backup
            sudo -n install -d -o root -g root -m 0755 /etc/bababuilds-erp
            config=/etc/bababuilds-erp/release-manager.json
            if ! sudo -n test -e "$config"; then
              sudo -n install -o root -g root -m 0600 "$reviewed/ops/erp-release/release-manager.example.json" "$config"
            else
              echo "Protected ERP release config exists: left untouched"
            fi
            evidence=/var/lib/bababuilds-erp/release-manager/recovery.json
            if ! sudo -n test -e "$evidence"; then
              sudo -n install -o root -g root -m 0600 "$reviewed/ops/erp-release/recovery.example.json" "$evidence"
              echo 'Created all-FALSE recovery checklist; activation remains blocked'
            fi
            if sudo -n test -f /etc/bababuilds-erp/backup.env; then
              echo 'Backup operator config is present; schedule/restore evidence must still be checked'
            else
              echo 'Backup operator config missing: encrypted off-host backup not commissioned'
            fi
            echo 'ERP_OPERATOR_BOOTSTRAP_PASS; NODE22_LIVE_UNCHANGED=true; AUTOMATIC_PROMOTION_DISABLED=true'
            rm -rf -- "$incoming"
