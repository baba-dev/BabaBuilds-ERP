name: Validate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, erp-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-next-

      - name: Report Next.js cache status
        run: echo "Next.js cache hit? ${{ steps.next-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: npm ci

      - name: Verify auth/email dependency tree
        run: npm ls next-auth nodemailer @types/nodemailer

      - name: Run locale checks
        run: npm run check:locales

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build


  prisma-migrate-deploy:
    runs-on: [self-hosted, linux, x64, erp-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma migrations (fresh baseline + deploy + drift check)
        run: |
          set -euxo pipefail
          export DATABASE_URL="file:./prisma/ci-migrate.db"
          rm -f prisma/ci-migrate.db prisma/ci-migrate.db-journal
          sqlite3 prisma/ci-migrate.db < prisma/baseline/00000000000000_init_baseline.sql
          npx prisma migrate resolve --applied 20260407100000_invoice_status_enum
          npx prisma migrate resolve --applied 20260407113000_init
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code
