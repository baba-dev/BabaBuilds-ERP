name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify auth/email dependency tree
        run: npm ls next-auth nodemailer @types/nodemailer

      - name: Run locale checks
        run: npm run check:locales

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
