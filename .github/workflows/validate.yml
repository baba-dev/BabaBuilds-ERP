name: Validate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: runs-on: [self-hosted, linux, x64, erp-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-next-

      - name: Report Next.js cache status
        run: echo "Next.js cache hit? ${{ steps.next-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: npm ci

      - name: Verify auth/email dependency tree
        run: npm ls next-auth nodemailer @types/nodemailer

      - name: Run locale checks
        run: npm run check:locales

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
