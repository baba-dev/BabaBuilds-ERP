name: ERP Node26 VPS commissioning (safe)

# This is an intentional one-time main-branch bootstrap after review. It runs
# a sanitized inventory and installs ONLY a checksum-verified side-by-side Node
# runtime. It NEVER restarts ERP, migrates a database, or enables auto-promotion.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/erp-node26-commission.yml
      - ops/erp-release/commission.py
  workflow_dispatch:
    inputs:
      install_node:
        description: Install the verified isolated Node 26 runtime after audit
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: erp-node26-vps-commission
  cancel-in-progress: false

jobs:
  commissioning:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Audit VPS and verify isolated Node26 installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy reviewed commissioning script to unprivileged upload area
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: ops/erp-release/commission.py
          target: /tmp/erp-node26-safe-commission-${{ github.sha }}
          strip_components: 2

      - name: Root-own and verify source before safe commissioning
        uses: appleboy/ssh-action@v1.2.5
        env:
          INSTALL_NODE: ${{ github.event_name == 'push' || inputs.install_node }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: INSTALL_NODE
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            source="/tmp/erp-node26-safe-commission-${{ github.sha }}/commission.py"
            target="/usr/local/lib/bababuilds-erp-release/commission.py"
            test -f "$source"
            sudo -n install -d -o root -g root -m 0755 /usr/local/lib/bababuilds-erp-release
            sudo -n install -o root -g root -m 0644 "$source" "$target"
            # Verified Git blob SHA is a fixed reviewed source identity. Never run
            # a root script directly from a user-writable /tmp directory.
            expected="9ba1897f1f0f9c20b067e20b62d77f8bd2ee7d5f"
            actual="$(sudo -n git hash-object "$target")"
            test "$actual" = "$expected" || { echo 'Commissioner source mismatch'; exit 1; }
            sudo -n /usr/bin/python3 "$target" audit
            if [[ "$INSTALL_NODE" == 'true' ]]; then
              sudo -n /usr/bin/python3 "$target" install-node
              sudo -n /usr/bin/python3 "$target" audit
            else
              echo 'Read-only audit completed; runtime install not requested'
            fi
            rm -f -- "$source"
            rmdir -- "/tmp/erp-node26-safe-commission-${{ github.sha }}" 2>/dev/null || true
