name: ERP VPS storage and Node inventory (temporary, read-only)
on:
  push:
    branches: [ops/vps-lean-cleanup-audit-20261117]
    paths:
      - .github/workflows/vps-storage-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Collect sanitized disk and runtime evidence (read-only)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: \${{ secrets.HOST }}
          username: \${{ secrets.USERNAME }}
          key: \${{ secrets.SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            import os, json, shutil, subprocess
            from pathlib import Path
            def call(argv, timeout=20):
                try:
                    r=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                                     text=True,timeout=timeout,check=False)
                    return (r.returncode,r.stdout.strip())
                except (OSError,subprocess.TimeoutExpired):
                    return (-1,"")
            def size(path):
                p=Path(path)
                if not p.exists() and not p.is_symlink():
                    return None
                rc,out=call(["/usr/bin/du","-sxB1",str(p)],timeout=45)
                try:return int(out.split()[0]) if rc==0 else None
                except (IndexError,ValueError):return None
            def folder(path):
                p=Path(path)
                if not p.is_dir():return []
                try:return sorted([x for x in p.iterdir() if not x.is_symlink()],
                                  key=lambda x:x.name)
                except OSError:return []
            def listing(path,limit=100):
                arr=[]
                for p in folder(path)[:limit]:
                    n=size(p)
                    if n is not None:arr.append({"name":p.name,"bytes":n,"directory":p.is_dir()})
                return sorted(arr,key=lambda x:x["bytes"],reverse=True)
            service_names=["bababuilds-erp.service","postgresql@17-main.service",
                           "menuminute-web.service","menuminute-worker.service",
                           "clubkeep-web.service","pm2-root.service"]
            services={k:call(["/usr/bin/systemctl","is-active",k])[1]
                      for k in service_names}
            protected=["/var/www/bababuilds-erp/private_uploads",
                      "/var/www/bababuilds-erp/backups",
                      "/var/lib/postgresql","/var/lib/menuminute",
                      "/var/www/clubkeep"]
            candidate_roots=[
                "/opt/bababuilds-erp","/opt/bababuilds-erp/releases",
                "/opt/bababuilds-erp-cutover",
                "/opt/bababuilds-erp-staging",
                "/var/www/bababuilds-erp/.next",
                "/var/www/bababuilds-erp/.next/cache",
                "/var/www/bababuilds-erp/.next/standalone/.next/cache",
                "/root/.npm","/root/.cache",
                "/var/lib/menuminute/incoming","/var/www/clubkeep/releases",
                "/var/log/journal","/tmp"
            ]
            disks={}
            for p in ("/","/opt","/var"):
                u=shutil.disk_usage(p)
                disks[p]={"total":u.total,"used":u.used,"free":u.free}
            mounts=call(["/usr/bin/findmnt","-rn","-o","TARGET,SOURCE,FSTYPE"])[1].splitlines()
            active_link=Path("/opt/bababuilds-erp/releases/current")
            current=str(active_link.resolve()) if active_link.is_symlink() else None
            node_exec={}
            for p in ("/opt/bababuilds-erp/node22/bin/node",
                      "/opt/bababuilds-erp/node26/bin/node",
                      "/root/.nvm/versions/node/v24.14.1/bin/node",
                      "/usr/bin/node","/usr/local/bin/node"):
                node_exec[p]=Path(p).exists()
            report={
                "disks":disks,"mount_roots":mounts[:15],
                "services":services,"current_erp_release":current,
                "erp_node_binaries":node_exec,
                "directory_sizes":{p:size(p) for p in candidate_roots},
                "erp_releases":listing("/opt/bababuilds-erp/releases",35),
                "erp_cutovers":listing("/opt/bababuilds-erp-cutover",20),
                "erp_staging":listing("/opt/bababuilds-erp-staging",20),
                "erp_next_cache":listing("/var/www/bababuilds-erp/.next/cache",20),
                "incoming_menuminute":listing("/var/lib/menuminute/incoming",8),
                "root_cache":listing("/root/.cache",15),
                "root_npm":listing("/root/.npm",15),
                "opt_top":listing("/opt",30),
                "var_www":listing("/var/www",25),
                "var_lib":listing("/var/lib",30),
                "journald_disk_usage":call(["/usr/bin/journalctl","--disk-usage"])[1],
                "protected_roots_present":{p:Path(p).exists() for p in protected},
                "production_database":call(["/usr/bin/systemctl","is-active",
                                           "postgresql@17-main.service"])[1],
                "read_only":True
            }
            print("ERP_STORAGE_INVENTORY="+json.dumps(report,sort_keys=True))
            PY
