name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: NPM Audit & Fix
    runs-on: [self-hosted, linux, x64, erp-ci]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Run Audit
        run: npm audit > npm-audit-before.txt || true # Report-only; unresolved advisories are handled below.
        
      - name: Run Audit Fix
        run: npm audit fix || true

      - name: Run Audit After Fix
        run: npm audit > npm-audit-after.txt || true

      - name: Upload Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-before.txt
            npm-audit-after.txt
          retention-days: 30
        
      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly security audit and dependency updates"
          branch: security-audit-updates
          title: "🛡️ Weekly Security Audit Updates"
          body: |
            This PR was automatically generated by the Weekly Security Audit workflow.
            It contains dependency updates from `npm audit fix`.
            
            Please review the changes and merge if they pass the CI.
          labels: |
            security
            dependencies
            automated-pr
