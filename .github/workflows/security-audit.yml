name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: NPM Audit & Fix
    runs-on: [self-hosted, linux, x64, erp-ci]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Run Audit
        run: npm audit || true # Don't fail the build here so we can try to fix it
        
      - name: Run Audit Fix
        run: npm audit fix
        
      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly security audit and dependency updates"
          branch: security-audit-updates
          title: "🛡️ Weekly Security Audit Updates"
          body: |
            This PR was automatically generated by the Weekly Security Audit workflow.
            It contains dependency updates from `npm audit fix`.
            
            Please review the changes and merge if they pass the CI.
          labels: |
            security
            dependencies
            automated-pr
