name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Read-only npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Security audit must NEVER alter the lockfile, push commits, or deploy.
      - name: Reproducible dependency install (no dependency scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture full and production-only security audits
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'JS'
          const fs = require('node:fs');
          for (const [label,path] of [
            ['All dependencies','npm-audit-all.json'],
            ['Production dependencies','npm-audit-production.json']
          ]) {
            const audit=JSON.parse(fs.readFileSync(path,'utf8'));
            if (!audit.metadata?.vulnerabilities) throw new Error('Incomplete npm audit: '+path);
            const line=label+': '+JSON.stringify(audit.metadata.vulnerabilities);
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### '+label+'\n\n'+line+'\n\n');
          }
          JS

      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: weekly-npm-security-audit
          path: |
            npm-audit-all.json
            npm-audit-production.json
          retention-days: 30
