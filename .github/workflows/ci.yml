name: CI

# One workflow, parallel jobs, one required check (`gate`).
# Runner: GitHub-hosted by default. To use the self-hosted pool instead, set the repository
# variable CI_RUNS_ON to: ["self-hosted","linux","x64","erp-ci"]
# Mirror locally with: npm run ci:fast

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `!cancelled()` runs every check even if an earlier one failed, so one run
      # reports all problems instead of one per push.
      - name: Locale key parity
        run: npm run check:locales

      - name: Lint (ESLint + KPI coverage)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Demo template coverage
        if: ${{ !cancelled() }}
        run: npm run validate:demos

  test:
    name: Unit and integration tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Full Vitest suite (previously only 2 of ~90 test files ran in CI).
      - name: Vitest
        run: npm test

  prisma:
    name: Prisma migrations
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Ensure sqlite3 CLI
        run: command -v sqlite3 >/dev/null || sudo apt-get install -y --no-install-recommends sqlite3

      - name: Fresh baseline, deploy, and drift check
        run: |
          set -euxo pipefail
          export DATABASE_URL="file:./prisma/ci-migrate.db"
          rm -f prisma/ci-migrate.db prisma/ci-migrate.db-journal
          sqlite3 prisma/ci-migrate.db < prisma/baseline/00000000000000_init_baseline.sql
          npx prisma migrate resolve --applied 20260407100000_invoice_status_enum
          npx prisma migrate resolve --applied 20260407113000_init
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code

  build:
    name: Production build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  e2e-smoke:
    name: Browser smoke (demo)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # Advisory until it has proven stable on this runner. Set repository variable
    # CI_SMOKE_BLOCKING=true to make it required through the gate job.
    continue-on-error: ${{ vars.CI_SMOKE_BLOCKING != 'true' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DEMO_CIRCUIT_BREAKER_THRESHOLD: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/test-env

      # Runs against `next dev` (see playwright.config.ts): demo sign-in needs the
      # development-only CAPTCHA bypass. Catches demo provisioning and route regressions.
      - name: Smoke tests
        run: npm run test:browser:smoke -- --trace off

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # The only check branch protection needs to require: stable name, and it fails if any
  # job failed or was cancelled (skipped is fine).
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [static, test, prisma, build, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
