name: CI

# Deliberately simple so it runs on a small self-hosted runner: ONE job, ONE dependency install,
# checks run one after another (not in parallel) so they do not fight for memory.
# Runner: GitHub-hosted by default. To use the self-hosted pool, set the repository variable
# CI_RUNS_ON to: ["self-hosted","linux","x64","erp-ci"]
# The production build and the browser tests are not part of every PR: see ci-extended.yml
# (nightly + manual) and regression.yml (nightly). Mirror this locally with: npm run ci:fast

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The only check branch protection needs to require. The deploy workflow also waits for this
  # workflow to succeed on main.
  gate:
    name: CI gate
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 90
    env:
      # tsc and eslint need more than the small default heap Node picks on a low-memory runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `!cancelled()` keeps going after a failure, so one run reports every problem instead of one per push.
      - name: Locale key parity
        run: npm run check:locales

      - name: Lint (ESLint + KPI coverage)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Demo template coverage
        if: ${{ !cancelled() }}
        run: npm run validate:demos

      # Runs in an isolated temp copy of the schema. Fails if the schema changed without a migration,
      # or if the migration history does not apply cleanly.
      - name: Prisma migration history
        if: ${{ !cancelled() }}
        run: npm run check:migrations

      # Some tests use the real Prisma client against SQLite; the schema hardcodes file:./dev.db.
      - name: Create test database
        if: ${{ !cancelled() }}
        run: npx prisma db push --skip-generate

      # Two workers: the full suite on every core would exhaust memory on a small runner.
      - name: Unit and integration tests
        if: ${{ !cancelled() }}
        run: npm test -- --maxWorkers=2
