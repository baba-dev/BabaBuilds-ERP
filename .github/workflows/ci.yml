name: CI

# Built to be cheap on the small self-hosted runner: ONE job, ONE install (reused between runs), checks run
# one after another so they do not fight for memory, ESLint and TypeScript results are cached on the runner
# between runs, and the slow migration check only runs when the database schema or its history changed.
# The production build is in ci-extended.yml and the browser tests in regression.yml (both nightly).
# Mirror this locally with: npm run ci:fast

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# A newer push to a pull request cancels the older run, so the single runner never works on stale code.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The only check branch protection needs to require. The deploy workflow also waits for this
  # workflow to succeed on main.
  gate:
    name: CI gate
    runs-on: [self-hosted, linux, x64, erp-ci]
    timeout-minutes: 90
    env:
      # tsc and eslint need more than the small default heap Node picks on a low-memory runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # Two commits deep, so we can tell which files this change touched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup

      # `!cancelled()` keeps going after a failure, so one run reports every problem instead of one per push.
      - name: Locale key parity
        run: npm run check:locales

      # Same checks as `npm run lint`, with a content-keyed cache on the runner: unchanged files are skipped.
      - name: Lint (ESLint + KPI coverage)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$HOME/.cache/erp-ci"
          npx eslint . --cache --cache-strategy content --cache-location "$HOME/.cache/erp-ci/eslintcache"
          npm run check:kpi-impact

      # Same as `npm run typecheck`, incremental: only files that changed since the last run are re-checked.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$HOME/.cache/erp-ci"
          npx tsc --noEmit --incremental --tsBuildInfoFile "$HOME/.cache/erp-ci/tsc.tsbuildinfo"

      - name: Demo template coverage
        if: ${{ !cancelled() }}
        run: npm run validate:demos

      # Slow (builds throwaway databases), so skip it unless the schema, migrations or the check itself changed.
      - name: Did the database schema change?
        id: db
        if: ${{ !cancelled() }}
        run: |
          if ! git rev-parse --verify -q HEAD^1 >/dev/null || git diff --name-only HEAD^1 HEAD | grep -qE '^(prisma/|scripts/check-migrations\.sh)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schema or migration changes: skipping the migration history check."
          fi

      - name: Prisma migration history
        if: ${{ !cancelled() && steps.db.outputs.changed == 'true' }}
        run: npm run check:migrations

      # Some tests use the real Prisma client against SQLite; the schema hardcodes file:./dev.db.
      - name: Create test database
        if: ${{ !cancelled() }}
        run: npx prisma db push --skip-generate

      # Two workers: the full suite on every core would exhaust memory on a small runner.
      - name: Unit and integration tests
        if: ${{ !cancelled() }}
        run: npm test -- --maxWorkers=2
