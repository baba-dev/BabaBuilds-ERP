name: CI

# GitHub-hosted runners, parallel jobs, one required check (`gate`).
# SECURITY: this workflow runs on pull requests, so it must never use a self-hosted runner:
# in a public repository anyone can open a pull request, and the job would run their code on your machine.
# Self-hosted is only for deploy/backup/audit (scheduled or after CI on main), see those workflows.
# Mirror the static + test checks locally with: npm run ci:fast

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# A newer push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bababuilds_erp_ci

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `!cancelled()` runs every check even if an earlier one failed, so one run
      # reports all problems instead of one per push.
      - name: Locale key parity
        run: npm run check:locales

      - name: Lint (ESLint + KPI coverage)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Demo template coverage
        if: ${{ !cancelled() }}
        run: npm run validate:demos

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # PostgreSQL 17 only: apply committed baseline before all integration tests.
      - name: Prepare isolated PostgreSQL test database
        run: npx prisma migrate deploy
      - name: Vitest (complete suite, including financial concurrency)
        env:
          CI_POSTGRES_FINANCE_TESTS: "1"
        run: npm test

  prisma:
    name: Prisma migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # PostgreSQL 17: committed baseline must match live schema with zero drift.
      - name: Migration history applies cleanly and matches the schema
        run: npm run check:migrations

      - name: Enforce PostgreSQL-only repository
        run: node scripts/verify-postgresql-only.mjs

      - name: Validate SQLite retirement operator safety
        run: |
          python3 -m py_compile scripts/operations/retire_erp_sqlite.py
          python3 -m unittest discover -s tests/ops -p 'test_*.py' -v

  build:
    name: Production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}-

      - name: Prepare PostgreSQL for build-time data dependencies
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # Exercise the actual packaged standalone entrypoint, never next dev.
      # PostgreSQL is an isolated, disposable CI service; all external effects disabled.
      - name: Node 26 standalone runtime smoke
        env:
          AUTH_GOOGLE_ENABLED: "false"
          AUTH_EMAIL_ENABLED: "false"
        run: node scripts/ci/standalone-smoke.mjs

  e2e-smoke:
    name: Browser smoke (demo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    timeout-minutes: 25
    # Required by default. If it ever becomes flaky, set repository variable CI_SMOKE_ADVISORY=true
    # to keep it running but stop it blocking merges.
    continue-on-error: ${{ vars.CI_SMOKE_ADVISORY == 'true' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DEMO_CIRCUIT_BREAKER_THRESHOLD: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-env

      # Runs against `next dev` (see playwright.config.ts): demo sign-in needs the
      # development-only CAPTCHA bypass. Catches demo provisioning and route regressions.
      - name: Smoke tests
        run: npm run test:browser:smoke -- --trace off

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Pull requests only: flags newly added dependencies with known vulnerabilities or disallowed licences.
  # Advisory (not in the gate): it needs the repository's dependency graph, which is on for public repos.
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # The only check branch protection needs to require: stable name, and it fails if any
  # job failed or was cancelled (skipped is fine).
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [static, test, prisma, build, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
