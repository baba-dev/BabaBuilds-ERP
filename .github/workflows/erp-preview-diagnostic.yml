name: ERP private Node26 preview diagnosis (temporary)
on:
  push:
    branches: [diagnose/erp-node26-preview-20261117]
    paths:
      - .github/workflows/erp-preview-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare private staging and production-mode preview using approved runtime
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 8m
          script: |
            set -euo pipefail
            sudo -n /usr/bin/python3 - <<'PY'
            import os, time, subprocess, re
            from pathlib import Path
            from urllib.request import urlopen, build_opener, HTTPRedirectHandler
            from urllib.error import HTTPError
            base=Path("/opt/bababuilds-erp/releases")
            sha="38b0647e530f54e7cd7753aacc567cc94e0bf42f"
            matches=sorted(base.glob("sha-"+sha+"-*/preview.log"))
            print("DIAGNOSTIC_CANDIDATES",len(matches))
            if not matches:
                raise SystemExit("No failed candidate log found")
            preview=matches[-1]
            runtime=preview.parent/"runtime"
            text=preview.read_text(errors="replace")
            patterns={
                "ready":"Ready in", "address_in_use":"EADDRINUSE",
                "permission":"EACCES", "missing_module":"MODULE_NOT_FOUND",
                "missing_module_esm":"ERR_MODULE_NOT_FOUND",
                "file_not_found":"ENOENT", "db_connection":"ECONNREFUSED",
                "prisma_error":"PrismaClientInitializationError",
                "prisma_engine":"PrismaClientKnownRequestError",
                "db_auth":"P1000", "db_unreachable":"P1001",
                "missing_env":"Missing required", "jwt":"JWT",
                "fatal":"Error:", "next_server":"Next.js",
                "blocked":"blocked", "unhandled":"unhandledRejection",
            }
            print("DIAGNOSTIC_LOG_BYTES",len(text))
            print("DIAGNOSTIC_LOG_FLAGS", {name:text.count(needle) for name,needle in patterns.items() if needle in text})
            print("DIAGNOSTIC_RUNTIME",runtime.is_dir(),"SERVER",(runtime/"server.js").is_file(),"SERVICE_WORKER",(runtime/"public/sw.js").is_file())
            envbase={"PATH":"/usr/sbin:/usr/bin:/sbin:/bin","HOME":"/root","NODE_ENV":"production",
                     "PORT":"3199","HOSTNAME":"127.0.0.1",
                     "PRIVATE_UPLOADS_DIR":"/var/www/bababuilds-erp/private_uploads"}
            argv=["/opt/bababuilds-erp/node26/bin/node",
                  "--env-file=/var/www/bababuilds-erp/.env",
                  "--env-file=/etc/bababuilds-erp/production-database.env",
                  str(runtime/"server.js")]
            class NR(HTTPRedirectHandler):
                def redirect_request(self,*args,**kwargs):return None
            opener=build_opener(NR)
            def status(path):
                try:
                    return opener.open("http://127.0.0.1:3199/"+path,timeout=2).status
                except HTTPError as e: return e.code
                except Exception: return 0
            for name,stage in (("stage",True),("production_preview",False)):
                env=envbase.copy()
                if stage:env["ERP_STAGING_MODE"]="1"
                with (preview.parent/("diagnostic-"+name+".log")).open("w") as fp:
                    p=subprocess.Popen(argv,cwd=runtime,env=env,stdout=fp,stderr=fp,start_new_session=True)
                    try:
                        codes=[]
                        for _ in range(8):
                            code=status("login")
                            codes.append(code)
                            if code in (200,302,307,308): break
                            if p.poll() is not None:break
                            time.sleep(1)
                        print("DIAGNOSTIC_MODE",name,"LOGIN_STATUS",codes[-1] if codes else None,
                              "PROCESS_EXIT",p.poll(),"SESSION_STATUS",status("api/auth/session"))
                    finally:
                        p.terminate()
                        try:p.wait(timeout=5)
                        except subprocess.TimeoutExpired:p.kill();p.wait()
                data=(preview.parent/("diagnostic-"+name+".log")).read_text(errors="replace")
                print("DIAGNOSTIC_MODE_FLAGS",name,{k:data.count(v) for k,v in patterns.items() if v in data})
            print("DIAGNOSTIC_COMPLETE_NO_PRODUCTION_CHANGES")
            PY
