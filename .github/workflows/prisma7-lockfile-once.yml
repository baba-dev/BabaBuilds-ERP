name: Temporary Prisma 7 Lockfile Regeneration
on:
  push:
    branches: [feature/prisma-7-10-1-postgres-upgrade]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/prisma-7-10-1-postgres-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate exact lockfile and validate client
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bababuilds_erp_ci
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run check:security-boundaries
          npx --no-install prisma validate
          node -e 'const p=require("./package-lock.json").packages; for(const n of ["prisma","@prisma/client","@prisma/adapter-pg"]) if(p["node_modules/"+n]?.version!=="7.10.1") throw Error(n+" != 7.10.1")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile change"; exit 1; }
          git commit -m "chore(prisma): lock Prisma 7.10.1 CLI, client and PostgreSQL adapter"
          git push origin HEAD:feature/prisma-7-10-1-postgres-upgrade
