name: ERP production deployment (standalone handoff)

# The PostgreSQL cutover on 2026-11-16 activated a Node 22 standalone
# release outside /var/www/bababuilds-erp. The prior workflow rebuilt that
# SQLite-era checkout and restarted a different PM2 command. It must NOT run
# after cutover: doing so could silently leave the application on stale code
# and disturb media permissions.
#
# This is intentionally a non-deploying workflow until an independently
# tested, immutable standalone release promoter replaces it. A green CI
# merge must NEVER automatically rewrite or restart the live PG ERP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-handoff:
    name: Standalone deployment handoff (no server changes)
    runs-on: ubuntu-latest
    steps:
      - name: Explain current release controls
        shell: bash
        run: |
          cat <<'EOF'
          No deployment was performed.
          The live ERP is a Node 22 standalone release backed by PostgreSQL 17.
          The former in-place /var/www/bababuilds-erp deployment is disabled.
          Changes require a separately reviewed build, health check, writable
          media mapping, and a controlled PM2 activation with forward recovery.
          Track replacement deployment automation under the ERP post-cutover
          operations issue. Do not restart the existing PM2 command from here.
          EOF
