name: Deploy ERP to Production

# This tells GitHub to run this script ONLY when you push to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Go to the project folder
            cd /var/www/bababuilds-erp
            
            # 2. Pull the latest code we just pushed
            git pull origin main
            
            # 3. Install any new packages
            npm install
            
            # 4. Apply any database changes (Prisma)
            npx prisma generate
            npx prisma db push
            
            # 5. Rebuild the Next.js application
            npm run build
            
            # 6. Restart the live server seamlessly
            pm2 restart erp