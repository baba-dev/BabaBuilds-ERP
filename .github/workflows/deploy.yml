name: ERP immutable Node 26 systemd release

# Only completed, successful, repository-owned CI pushes to latest main qualify.
# Automatic after current main's completed green CI; no database migration or backup.
# Only the ERP systemd service is restarted; sibling VPS services stay untouched.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Deploy latest green main to ERP Node26 systemd (no DB migration or backup)"
        type: boolean
        default: false
        required: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: erp-immutable-production
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify latest trusted main CI
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' && inputs.confirm_production == true) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.conclusion == 'success' &&
           vars.CI_SMOKE_ADVISORY != 'true') }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Verify current main SHA and all CI gates
        id: check
        uses: actions/github-script@v7
        env:
          CI_SMOKE_ADVISORY: ${{ vars.CI_SMOKE_ADVISORY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({owner, repo, ref:"heads/main"});
            let run;
            if (context.eventName === "workflow_dispatch") {
              // Manual operations must also use a completed, green CI push for
              // the CURRENT main SHA. Never trust an older CI or bypass tests.
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id:"ci.yml", branch:"main",
                event:"push", status:"completed", per_page:100
              });
              run = runs.find(r => r.head_sha === ref.data.object.sha &&
                r.status === "completed" && r.conclusion === "success");
              if (!run) throw Error("Latest main has no successful completed CI push");
            } else {
              run = context.payload.workflow_run;
              if (run.head_sha !== ref.data.object.sha ||
                  run.head_branch !== "main" ||
                  run.head_repository.full_name !== context.repo.owner + "/" + context.repo.repo ||
                  run.event !== "push" || run.conclusion !== "success")
                throw Error("Untrusted or superseded CI run");
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id:run.id, per_page:100
            });
            for (const name of [
              "Static checks", "Unit and integration tests", "Prisma migrations",
              "Production build", "Browser smoke (demo)", "CI gate"
            ]) {
              if (jobs.filter(j => j.name === name && j.conclusion === "success").length !== 1)
                throw Error("Missing or failed required CI check: " + name);
            }
            // A non-advisory browser job is required for both manual and auto.
            if (process.env.CI_SMOKE_ADVISORY === "true")
              throw Error("Browser smoke advisory mode blocks production");
            core.setOutput("sha", run.head_sha);

  arm64-build:
    name: Native ARM64 immutable candidate
    needs: provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bababuilds_erp_ci
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: release-only-ci-key-00000000000000000000
      AUTH_GOOGLE_ENABLED: "false"
      AUTH_EMAIL_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and smoke isolated ARM64 PostgreSQL standalone
        run: |
          test "$(uname -m)" = "aarch64"
          npx prisma migrate deploy
          npm run build
          node scripts/ci/standalone-smoke.mjs
      - name: Create verified release bundle
        run: |
          python3 ops/erp-release/package.py build \
            --sha "${{ needs.provenance.outputs.sha }}" \
            --dest "$RUNNER_TEMP/erp-release"
      - uses: actions/upload-artifact@v4
        with:
          name: erp-arm64-${{ needs.provenance.outputs.sha }}
          path: ${{ runner.temp }}/erp-release/
          if-no-files-found: error
          retention-days: 14

  promote:
    name: Deploy verified ARM64 release to ERP systemd
    needs: [provenance, arm64-build]
    runs-on: ubuntu-24.04
    environment: erp-production
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ needs.provenance.outputs.sha }}
    steps:
      - name: Checkout reviewed deployment operator for the exact verified SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false

      - name: Download verified native ARM64 candidate
        uses: actions/download-artifact@v4
        with:
          name: erp-arm64-${{ needs.provenance.outputs.sha }}
          path: erp-release

      - name: Recheck that candidate still matches latest main
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const ref = await github.rest.git.getRef({owner, repo, ref:"heads/main"});
            if (ref.data.object.sha !== process.env.DEPLOY_SHA)
              throw Error("Newer main commit exists; older release refused");

      - name: Copy verified release artifacts to ERP VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "erp-release/erp-release.tar.gz,erp-release/manifest.json"
          target: /tmp/erp-systemd-${{ needs.provenance.outputs.sha }}
          strip_components: 1

      - name: Copy exact reviewed systemd activation operator to ERP VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "ops/erp-release/systemd_promote.py"
          target: /tmp/erp-systemd-${{ needs.provenance.outputs.sha }}
          strip_components: 2

      - name: Activate only ERP systemd service and verify Node26
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            incoming="/tmp/erp-systemd-$DEPLOY_SHA"
            test -f "$incoming/erp-release.tar.gz"
            test -f "$incoming/manifest.json"
            test -f "$incoming/systemd_promote.py"
            test ! -L "$incoming/systemd_promote.py"
            operator="/usr/local/lib/bababuilds-erp-release/systemd_promote.py"
            sudo -n install -d -o root -g root -m 0755 /usr/local/lib/bababuilds-erp-release
            sudo -n install -o root -g root -m 0644 "$incoming/systemd_promote.py" "$operator"
            test "$(sudo -n git hash-object "$operator")" = "5a1f974a1d87f2ad215954287c8e1d875edf63d3" || {
              echo 'ERP_SYSTEMD_OPERATOR_REVIEWED_SHA_MISMATCH'; exit 1;
            }
            sudo -n /usr/bin/python3 "$operator" preflight
            sudo -n /usr/bin/python3 "$operator" promote \
              --archive "$incoming/erp-release.tar.gz" \
              --manifest "$incoming/manifest.json" \
              --sha "$DEPLOY_SHA"
            sudo -n /usr/bin/python3 /usr/local/lib/bababuilds-erp-release/audit_vps.py
            # Retirement occurs only after the new Node26 systemd release is healthy,
            # and the read-only audit independently confirms zero Node22 consumers.
            if sudo -n test -d /opt/bababuilds-erp/node22; then
              sudo -n /usr/bin/python3 "$operator" retire-node22
            else
              echo 'ERP_NODE22_ALREADY_RETIRED'
            fi
            rm -f -- "$incoming/erp-release.tar.gz" "$incoming/manifest.json" "$incoming/systemd_promote.py"
            rmdir -- "$incoming" 2>/dev/null || true

      - name: Purge only ERP service-worker URL (when configured)
        shell: bash
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$CF_ZONE" || -z "$CF_TOKEN" ]]; then
            echo 'Cloudflare service-worker purge is not configured'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            --header "Authorization: Bearer $CF_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"files":["https://erp.bababuilds.com/sw.js"]}'
