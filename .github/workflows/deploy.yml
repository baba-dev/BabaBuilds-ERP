name: Deploy ERP to Production

# Deploys only after the CI workflow succeeded on a push to main, and deploys exactly the
# commit CI validated (not whatever main points to by the time the job runs).
# Manual runs (workflow_dispatch) deploy the selected ref's commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize deploys; never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # `event == 'push'` blocks workflow_run triggers from pull_request runs whose head branch
    # happens to be named "main" (e.g. a fork).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, erp-ci]
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            source ~/.bashrc
            export PATH=$PATH:/usr/bin:/usr/local/bin
            set -euo pipefail

            cd /var/www/bababuilds-erp

            git fetch origin main
            # Deploy the validated commit, and refuse anything that is not on main.
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || {
              echo "ERROR: $DEPLOY_SHA is not an ancestor of origin/main; refusing to deploy." >&2
              exit 1
            }
            git reset --hard "$DEPLOY_SHA"
            git clean -fd components/ui/ 2>/dev/null || true
            npm install --legacy-peer-deps

            npx prisma generate
            npx prisma db push
            npm run backfill:invoices
            rm -f public/sw.js
            npm run build

            if ! test -s public/sw.js; then
              echo "ERROR: Serwist service worker was not generated at public/sw.js after npm run build." >&2
              exit 1
            fi

            if ! grep -Eq "serwist|ServiceWorkerGlobalScope|addEventListener|precache|skipWaiting" public/sw.js; then
              echo "ERROR: public/sw.js exists but does not look like a generated Serwist/service-worker bundle." >&2
              exit 1
            fi

            chown -R root:root .

            find . -path ./node_modules -prune -o -type d -exec chmod 755 {} +
            find . -path ./node_modules -prune -o -type f -exec chmod 644 {} +

            chmod 600 .env* 2>/dev/null || true
            chmod 700 deploy.sh 2>/dev/null || true

            chmod 775 prisma
            chmod 664 prisma/*.db 2>/dev/null || true

            mkdir -p public/logos public/receipts public/invoices
            chmod -R 775 public/logos
            chmod -R 775 public/receipts
            chmod -R 775 public/invoices

            npx pm2 restart erp || npx pm2 start npm --name "erp" -- start

            sw_url="https://erp.bababuilds.com/sw.js"
            purge_cloudflare_sw() {
              if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
                # Purge the canonical service-worker URL after the origin is
                # restarted so Cloudflare cannot keep serving a stale /sw.js
                # object with old or missing MIME/cache headers.
                curl --fail --silent --show-error --request POST \
                  "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
                  --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                  --header "Content-Type: application/json" \
                  --data "{\"files\":[\"${sw_url}\"]}"
              else
                echo "Skipping Cloudflare /sw.js purge because CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN is not configured."
              fi
            }

            purge_cloudflare_sw

            sw_body="$(mktemp)"
            sw_headers="$(mktemp)"
            cleanup_sw_smoke() {
              rm -f "$sw_body" "$sw_headers"
            }
            trap cleanup_sw_smoke EXIT

            sw_smoke_passed=0
            for sw_attempt in 1 2 3 4 5; do
              : > "$sw_body"
              : > "$sw_headers"

              sw_status="$(curl --silent --show-error --location \
                --output "$sw_body" \
                --dump-header "$sw_headers" \
                --write-out "%{http_code}" \
                "$sw_url")"

              sw_content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); print value; exit }' "$sw_headers")"

              if [ "$sw_status" = "200" ] \
                && printf '%s' "$sw_content_type" | grep -Eiq '^(application|text)/(javascript|ecmascript|x-javascript)(;|$)' \
                && test -s "$sw_body" \
                && grep -Eq "serwist|ServiceWorkerGlobalScope|addEventListener|precache|skipWaiting" "$sw_body"; then
                sw_smoke_passed=1
                break
              fi

              if [ "$sw_attempt" != "5" ]; then
                echo "Waiting for $sw_url to return the latest uncached JavaScript response (attempt $sw_attempt/5)." >&2
                cat "$sw_headers" >&2
                purge_cloudflare_sw
                sleep 5
              fi
            done

            if [ "$sw_smoke_passed" != "1" ]; then
              if [ "$sw_status" != "200" ]; then
                echo "ERROR: $sw_url returned HTTP $sw_status, expected 200." >&2
                cat "$sw_headers" >&2
                exit 1
              fi

              if ! printf '%s' "$sw_content_type" | grep -Eiq '^(application|text)/(javascript|ecmascript|x-javascript)(;|$)'; then
                echo "ERROR: $sw_url returned Content-Type '$sw_content_type', expected a JavaScript MIME type." >&2
                cat "$sw_headers" >&2
                exit 1
              fi

              if ! test -s "$sw_body"; then
                echo "ERROR: $sw_url returned an empty body." >&2
                exit 1
              fi

              echo "ERROR: $sw_url body does not look like generated Serwist/service-worker code." >&2
              exit 1
            fi
