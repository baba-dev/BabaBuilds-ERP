name: Deploy ERP to Production

# The source-to-production path was restored after the PostgreSQL cutover.
# Every validated main CI commit builds inside a NEW Node22 release directory.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: erp-production-standalone-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate immutable main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "Validated source SHA ${DEPLOY_SHA:0:12}"

      - name: Build, preview and promote exact commit on ERP ARM64 VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            # Bootstrap the reviewed release operator from the SAME green main SHA.
            # This avoids a manual prerequisite after the prior workflow was disabled.
            app=/opt/bababuilds-erp-cutover/cut1611b/app
            state=/var/lib/bababuilds-erp/deployment
            sudo -n install -d -o root -g root -m 0700 /opt/bababuilds-erp/releases "$state"
            sudo -n git -C "$app" fetch --no-tags \
              https://github.com/baba-dev/BabaBuilds-ERP.git refs/heads/main
            sudo -n git -C "$app" merge-base --is-ancestor "$DEPLOY_SHA" FETCH_HEAD
            # Stage 1 Node26 landed in main before this deploy workflow.
            # Until the separately approved ARM64 Node26 runtime activation,
            # refuse to deploy a Node26-only source tree under production Node22.
            required_node="$(sudo -n git -C "$app" show "$DEPLOY_SHA:.nvmrc" | tr -d '[:space:]')"
            case "$required_node" in
              22|22.*) ;;
              *)
                echo "BLOCKED: main requires Node $required_node but production operator is Node22; Node26 Stage 2 must be activated separately." >&2
                exit 1
                ;;
            esac
            sudo -n git -C "$app" show "$DEPLOY_SHA:scripts/operations/deploy-erp-standalone.sh" \
              | sudo -n tee "$state/operator.next" >/dev/null
            sudo -n bash -n "$state/operator.next"
            sudo -n install -o root -g root -m 0700 \
              "$state/operator.next" /usr/local/sbin/bababuilds-erp-release
            sudo -n rm -f "$state/operator.next"
            sudo -n /usr/local/sbin/bababuilds-erp-release --check
            sudo -n /usr/local/sbin/bababuilds-erp-release --deploy "$DEPLOY_SHA"

      - name: Purge only the service worker from Cloudflare (when configured)
        shell: bash
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$CF_ZONE" || -z "$CF_TOKEN" ]]; then
            echo "Cloudflare credentials absent; skipping optional /sw.js purge."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            --header "Authorization: Bearer $CF_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"files":["https://erp.bababuilds.com/sw.js"]}'
