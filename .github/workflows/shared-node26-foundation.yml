name: BabaBuilds shared Node 26.13.1 ARM64 foundation

# A reviewed, one-time side-by-side runtime installation, never a service switch.
# PRs cannot access VPS SSH secrets; only reviewed main can run installation.
on:
  push:
    branches: [main]
    paths:
      - ops/shared-runtime/**
      - .github/workflows/shared-node26-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

# Do not race ERP production releases. This workflow does not restart any app.
concurrency:
  group: erp-immutable-production
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Verify Node.js release signature and install inactive ARM64 runtime
    environment: erp-production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify signed Node.js release and pinned ARM64 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="89e1853138db51e8b82d3e98ba9c0d3f2956a28e5e55ea1b7e12d25aae92d5dd"
          archive="node-v26.13.1-linux-arm64.tar.xz"
          base="https://nodejs.org/dist/v26.13.1"
          key="ops/shared-runtime/nodejs-release-key-5BE8A3F6.asc"
          expected_signer="5BE8A3F6C8A5C01D106C0AD820B1A390B168D356"
          actual_signer="$(gpg --batch --with-colons --show-keys "$key" | awk -F: '$1=="fpr"{print $10; exit}')"
          test "$actual_signer" = "$expected_signer" || {
            echo 'REJECT: signing key fingerprint mismatch' >&2; exit 1;
          }
          export GNUPGHOME="$RUNNER_TEMP/bababuilds-nodejs-gpg"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --import "$key"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --max-time 120 \
            "$base/SHASUMS256.txt" --output "$RUNNER_TEMP/SHASUMS256.txt"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --max-time 120 \
            "$base/SHASUMS256.txt.sig" --output "$RUNNER_TEMP/SHASUMS256.txt.sig"
          gpgv --keyring "$GNUPGHOME/pubring.kbx" \
            "$RUNNER_TEMP/SHASUMS256.txt.sig" "$RUNNER_TEMP/SHASUMS256.txt"
          test "$(grep -Fxc "$expected  $archive" "$RUNNER_TEMP/SHASUMS256.txt")" = 1 || {
            echo 'REJECT: signed manifest does not match pinned artifact' >&2; exit 1;
          }
          mkdir -p runtime-artifacts
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --max-time 300 \
            "$base/$archive" --output "runtime-artifacts/$archive"
          printf '%s  %s\n' "$expected" "runtime-artifacts/$archive" | sha256sum --check --status
          echo 'NODE26_OFFICIAL_SIGNED_ARTIFACT_VERIFIED release=v26.13.1 arch=linux-arm64'
      - name: Stage signed-artifact-verified runtime and reviewed installer
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: ops/shared-runtime/provision_node26.py,runtime-artifacts/node-v26.13.1-linux-arm64.tar.xz
          target: /tmp/bababuilds-node26-${{ github.sha }}
      - name: Install side-by-side only; confirm all live services untouched
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 14m
          script: |
            set -Eeuo pipefail
            incoming="/tmp/bababuilds-node26-${{ github.sha }}"
            uploaded="$incoming/ops/shared-runtime/provision_node26.py"
            archive="$incoming/runtime-artifacts/node-v26.13.1-linux-arm64.tar.xz"
            operator="/usr/local/lib/bababuilds-platform/provision_node26.py"
            test -f "$uploaded" && test ! -L "$uploaded"
            test -f "$archive" && test ! -L "$archive"
            sudo -n install -d -o root -g root -m 0755 /usr/local/lib/bababuilds-platform
            sudo -n install -o root -g root -m 0644 "$uploaded" "$operator"
            test "$(sudo -n git hash-object "$operator")" = "7fc1d533a0d6c9169521ba323c9ed08aa2e053c4" || {
              echo 'NODE26_INSTALLER_REVIEWED_SOURCE_MISMATCH' >&2; exit 1;
            }
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = \
              "89e1853138db51e8b82d3e98ba9c0d3f2956a28e5e55ea1b7e12d25aae92d5dd"
            sudo -n /usr/bin/python3 "$operator" --inventory
            sudo -n /usr/bin/python3 "$operator" --install --archive "$archive"
            sudo -n /usr/bin/python3 "$operator" --inventory
            rm -f -- "$uploaded" "$archive"
            rmdir "$incoming/ops/shared-runtime" "$incoming/ops" \
              "$incoming/runtime-artifacts" "$incoming" 2>/dev/null || true
            echo 'BABABUILDS_NODE26_FOUNDATION_PASS no_services_switched'
