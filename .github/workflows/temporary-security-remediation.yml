name: Temporary ERP security remediation
on:
  push:
    branches: [security/dependabot-safe-remediation-2026-11]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependabot-safe-remediation-2026-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build seven logical remediation commits
        env:
          CI: "true"
        run: bash scripts/security/remediate-once.sh
