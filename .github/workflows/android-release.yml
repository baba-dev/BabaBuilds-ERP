name: Android release (Google Play)

# Builds the Trusted Web Activity (TWA) wrapper with Bubblewrap, signs the App Bundle with the upload
# key and uploads it to Google Play. Manual only: the repo is public, so this never runs on pull requests.
#
# One-time setup (see docs/android-play-store.md §3b):
#   * The app must already exist in Play Console with its first AAB uploaded by hand.
#   * Create a GitHub *environment* named `google-play` (add required reviewers if you want an approval
#     gate) and put the five secrets below on it.
#
# Secrets (never echoed; only passed through env):
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore   (base64 -w0 android.keystore)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (bababuilds-upload)
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play Android Developer API service-account key (raw JSON)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "User-visible version name, e.g. 1.0.1"
        type: string
        required: true
      version_code:
        description: "Integer version code. Must be greater than appVersionCode in android/twa-manifest.json"
        type: string
        required: true
      track:
        description: "Play track to upload to"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (use draft while the app has never been released)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the protected default branch may ship to Play.
    if: github.ref == 'refs/heads/main'
    environment: google-play
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs and secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAVE_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::version_name must look like 1.2.3"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::version_code must be an integer"; exit 1; }
          current=$(jq -r '.appVersionCode' android/twa-manifest.json)
          if [ "$VERSION_CODE" -le "$current" ]; then
            echo "::error::version_code ($VERSION_CODE) must be greater than appVersionCode in android/twa-manifest.json ($current)"
            exit 1
          fi
          [ "$HAVE_KEYSTORE" = "true" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set on the google-play environment"; exit 1; }
          [ "$HAVE_SA" = "true" ] || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set on the google-play environment"; exit 1; }
          [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] && [ -n "$BUBBLEWRAP_KEY_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS secrets are required"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Bubblewrap and Android SDK components
        run: |
          set -euo pipefail
          npm install -g @bubblewrap/cli
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          # Bubblewrap validates the SDK root by looking for a `bin` (or `tools`) directory in it.
          [ -e "$SDK/bin" ] || sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          [ -e "$SDK/lib" ] || sudo ln -s "$SDK/cmdline-tools/latest/lib" "$SDK/lib"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"

      - name: Prepare signing key and version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        working-directory: android
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > android.keystore
          tmp=$(mktemp)
          jq --arg n "$VERSION_NAME" --argjson c "$VERSION_CODE" --arg a "$ANDROID_KEY_ALIAS" \
            '.appVersionName=$n | .appVersionCode=$c | .signingKey.alias=$a' twa-manifest.json > "$tmp"
          mv "$tmp" twa-manifest.json

      - name: Build signed AAB
        working-directory: android
        # `update` generates the Gradle project non-interactively (a bare `build` in a clean checkout
        # prompts to regenerate it and would hang); --skipVersionUpgrade keeps the version we just set.
        run: |
          set -euo pipefail
          bubblewrap update --skipVersionUpgrade </dev/null
          bubblewrap build --skipPwaValidation </dev/null

      - name: Verify the bundle
        working-directory: android
        run: |
          set -euo pipefail
          test -s app-release-bundle.aab
          unzip -p app-release-bundle.aab base/manifest/AndroidManifest.xml | strings | grep -q "com.bababuilds.erp.twa"
          jarsigner -verify app-release-bundle.aab 2>&1 | grep -q "jar verified"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bababuilds.erp.twa
          releaseFiles: android/app-release-bundle.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Remove signing material
        if: always()
        run: rm -f android/android.keystore
