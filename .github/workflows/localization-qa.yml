name: Localization QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-locales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run locale key parity check
        run: npm run check:locales
