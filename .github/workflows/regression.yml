name: Nightly Regression (Playwright)

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bababuilds_erp_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bababuilds_erp_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d bababuilds_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        
      - uses: ./.github/actions/test-env

      # Playwright starts `next dev` itself (playwright.config.ts), so no production build is needed.
      - name: Run Playwright tests
        env:
          DEMO_CIRCUIT_BREAKER_THRESHOLD: "1000"
        run: npx playwright test --trace off
        
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
