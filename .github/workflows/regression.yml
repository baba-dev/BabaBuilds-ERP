name: Nightly Regression (Playwright)

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        
      - uses: ./.github/actions/test-env

      # Playwright starts `next dev` itself (playwright.config.ts), so no production build is needed.
      - name: Run Playwright tests
        env:
          DEMO_CIRCUIT_BREAKER_THRESHOLD: "1000"
        run: npx playwright test --trace off
        
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
