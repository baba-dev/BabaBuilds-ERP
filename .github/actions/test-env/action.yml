name: Create Playwright test environment
description: Writes a throwaway .env (random secrets, external auth off) and creates a disposable PostgreSQL 17 schema.

runs:
  using: composite
  steps:
    - name: Write .env and apply PostgreSQL migrations
      shell: bash
      run: |
        {
          echo 'NEXTAUTH_URL="http://localhost:3000"'
          echo "NEXTAUTH_SECRET=\"$(openssl rand -hex 32)\""
          echo "AI_TOOL_CONFIRMATION_SECRET=\"$(openssl rand -hex 32)\""
          echo 'AUTH_GOOGLE_ENABLED=false'
          echo 'AUTH_EMAIL_ENABLED=false'
        } > .env
        npx prisma migrate deploy

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium
      shell: bash
      run: npx playwright install --with-deps chromium
