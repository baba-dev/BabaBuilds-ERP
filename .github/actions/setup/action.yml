name: Setup Node and install dependencies
description: Node version pinned from .nvmrc (matches package.json engines), npm cache, reproducible install.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Assert pinned Node and npm
      shell: bash
      run: |
        node -e 'const fs = require("node:fs"); const expected = fs.readFileSync(".nvmrc", "utf8").trim(); if (process.version !== "v" + expected) { throw new Error("Unexpected Node runtime " + process.version + "; expected " + expected); }'
        test "$(npm --version)" = "11.20.0" || { echo "::error::npm must be 11.20.0"; exit 1; }

    - name: Install dependencies
      shell: bash
      # postinstall runs `prisma generate`, so the client is ready after this step.
      run: npm ci --no-audit --no-fund
